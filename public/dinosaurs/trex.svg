  <path d="M280,320 C280,340 290,350 300,350" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Feet - More Accurate Shape -->
  <path d="M300,350 L290,360 L310,360" fill="none" stroke="black" stroke-width="2"/>
  
