<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Body -->
  <path d="M300,200 C350,180 400,200 400,250 C400,300 350,320 300,320 C250,320 200,300 200,250 C200,200 250,180 300,200" 
