  <path d="M300,280 C320,290 340,280 340,260" fill="none" stroke="black" stroke-width="1"/>
  
  <!-- Head - More Accurate Shape -->
  <path d="M400,250 C420,240 440,250 450,270 C450,290 440,300 420,300 C410,300 400,290 400,280" 
